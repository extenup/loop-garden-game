<canvas id="game" aria-label="Loop Garden: run circles around grumpy blobs to turn them into flowers, help friends, reach the sun door"></canvas>
<script>
// Loop Garden — deterministic rules engine (no DOM). Exposes globalThis.LG.
(function (G) {
  'use strict';
  const LG = G.LG || (G.LG = {});

  const C = LG.CONST = {
    DT: 1 / 120,
    PLAYER_R: 16,
    SPEED: 255,
    ACCEL: 2400,
    TRAIL_STEP: 7,
    TRAIL_MAX: 1250,
    MIN_LOOP_AREA: 3400,
    MIN_LOOP_WIDTH: 24, // 2*area/perimeter (mean width); rejects thin back-and-forth slivers
    CLOSE_R: 22,
    CLOSE_BACK: 160, // ribbon length that must separate the two touching points
    TRAIL_IDLE: 1.2, // standing still this long lets the ribbon fade
    TRAIL_AGE: 10, // ribbon older than this fades even while drifting slowly
    RESPAWN_TIME: 0.7,
    INVULN: 1.1,
    PICK_R: 30,
    GIVE_R: 60,
    FOLLOW_GAP: 34,
    HINT_IDLE: 6,
    DIZZY_ROOM: 34, // spare px a dizzy dasher leaves beside walls beyond the hero's own width
    SHRINK_STUN: 0.8, // a big grump shrunk by its first loop stands dazed this long before chasing
    // endless arena
    ARENA_SAFE: 260, // grumps never appear closer than this to the hero
    ARENA_WARN: 0.9, // seconds a spawn ring is shown before the grump appears
    ARENA_INV: 1.2, // invulnerability after a hit
    ARENA_KNOCK: 60, // knock-back distance after a hit
    ARENA_KNOCK_T: 0.2, // ...spread over this long (eases out, input ignored meanwhile)
    HEART_EVERY: 25, // a heart appears this long after the hero got hurt (while not at full hp)
  };

  // ---------- geometry ----------
  function segX(ax, ay, bx, by, cx, cy, dx, dy) {
    const rx = bx - ax, ry = by - ay, sx = dx - cx, sy = dy - cy;
    const den = rx * sy - ry * sx;
    if (Math.abs(den) < 1e-9) return null;
    const qx = cx - ax, qy = cy - ay;
    const t = (qx * sy - qy * sx) / den;
    const u = (qx * ry - qy * rx) / den;
    if (t <= 0 || t > 1 || u < 0 || u > 1) return null;
    return { t, u, x: ax + rx * t, y: ay + ry * t };
  }
  function polyArea(p) {
    let a = 0;
    for (let i = 0, j = p.length - 1; i < p.length; j = i++) a += (p[j].x + p[i].x) * (p[j].y - p[i].y);
    return Math.abs(a / 2);
  }
  function inPoly(x, y, p) {
    let ins = false;
    for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
      const a = p[i], b = p[j];
      if ((a.y > y) !== (b.y > y) && x < ((b.x - a.x) * (y - a.y)) / (b.y - a.y) + a.x) ins = !ins;
    }
    return ins;
  }
  function circRect(cx, cy, r, R) {
    const nx = Math.max(R.x, Math.min(cx, R.x + R.w));
    const ny = Math.max(R.y, Math.min(cy, R.y + R.h));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }
  function pushOut(e, r, R) {
    const nx = Math.max(R.x, Math.min(e.x, R.x + R.w));
    const ny = Math.max(R.y, Math.min(e.y, R.y + R.h));
    let dx = e.x - nx, dy = e.y - ny;
    const d2 = dx * dx + dy * dy;
    if (d2 >= r * r) return false;
    if (d2 > 1e-6) {
      const d = Math.sqrt(d2), k = (r - d) / d;
      e.x += dx * k; e.y += dy * k;
      if (Math.abs(dx) > Math.abs(dy)) e.vx = 0; else e.vy = 0;
    } else {
      // centre inside rect: push along shortest axis
      const l = e.x - R.x, rr = R.x + R.w - e.x, t = e.y - R.y, b = R.y + R.h - e.y;
      const m = Math.min(l, rr, t, b);
      if (m === l) e.x = R.x - r; else if (m === rr) e.x = R.x + R.w + r;
      else if (m === t) e.y = R.y - r; else e.y = R.y + R.h + r;
    }
    return true;
  }
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  LG.geo = { segX, polyArea, inPoly, circRect, pushOut, dist };

  // ---------- seeded rng ----------
  function rng(seed) {
    let s = seed >>> 0 || 1;
    return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  }
  // rng whose whole state lives in S.rs (a plain number), so arena states snapshot/replay exactly
  function rnd(S) {
    S.rs = (Math.imul(S.rs, 1664525) + 1013904223) >>> 0;
    return S.rs / 4294967296;
  }

  // ---------- level instantiation ----------
  function makeState(levelIndex) {
    const L = LG.LEVELS[levelIndex];
    const S = {
      li: levelIndex, W: L.w, H: L.h, t: 0, rand: rng(1234 + levelIndex * 97),
      player: { x: L.start.x, y: L.start.y, vx: 0, vy: 0, carry: null, dead: 0, inv: 0, face: 1, moving: 0 },
      check: { x: L.start.x, y: L.start.y },
      trail: [], trailLen: 0,
      walls: L.walls.map((r) => ({ ...r })),
      thorns: (L.thorns || []).map((r) => ({ ...r })),
      water: (L.water || []).map((w) => ({ ...w, bridged: false })),
      enemies: (L.enemies || []).map((e, i) => mkEnemy(e, i)),
      buds: (L.buds || []).map((b) => ({ ...b, open: false, anim: 0 })),
      cages: (L.cages || []).map((c) => ({ ...c, open: false, anim: 0 })),
      items: (L.items || []).map((it) => ({ ...it, hx: it.x, hy: it.y, taken: false, used: false })),
      npcs: (L.npcs || []).map((n) => ({ ...n, done: false, joy: 0 })),
      followers: (L.followers || []).map((f) => ({ ...f, hx: f.x, hy: f.y, on: false, home: false, scared: 0 })),
      doors: (L.doors || []).map((d) => ({ ...d, open: false, anim: 0 })),
      lanterns: (L.lanterns || []).map((l) => ({ ...l, lit: false })),
      sparkles: (L.sparkles || []).map((s) => ({ ...s, got: false })),
      gate: { ...L.gate, open: false, anim: 0 },
      exit: { ...L.exit },
      won: false, wonT: 0, winAt: 0, hurts: 0, loops: 0, bestCombo: 0,
      idle: 0, lastProgress: 0, path: [],
    };
    return S;
  }
  function mkEnemy(e, i) {
    const base = { kind: 'sleepy', r: 21, speed: 70, alive: true, pop: 0, id: i, required: true, st: 'idle', tm: 0, pi: 1, dir: 1, vx: 0, vy: 0 };
    const o = Object.assign(base, e);
    if (o.kind === 'big') o.r = e.r || 36;
    o.hx = o.x; o.hy = o.y;
    return o;
  }
  LG.makeState = makeState;

  // tasks shown on the exit gate (the arena has none: it never ends in a win)
  function tasks(S) {
    const out = [];
    if (S.arena) return out;
    for (const e of S.enemies) if (e.required) out.push({ kind: 'enemy', sub: e.kind, done: !e.alive, ref: e });
    for (const n of S.npcs) out.push({ kind: 'npc', sub: n.who, done: n.done, ref: n });
    for (const c of S.cages) if (c.task) out.push({ kind: 'cage', sub: c.who, done: c.open, ref: c });
    return out;
  }
  LG.tasks = tasks;

  // ---------- blocking geometry ----------
  function blockers(S, forEnemy) {
    const b = S.walls.slice();
    for (const w of S.water) {
      if (!w.bridged || !w.bridge) b.push(w);
      else if (w.bridge.x1 !== undefined) {
        b.push({ x: w.x, y: w.y, w: w.bridge.x1 - w.x, h: w.h });
        b.push({ x: w.bridge.x2, y: w.y, w: w.x + w.w - w.bridge.x2, h: w.h });
      } else {
        b.push({ x: w.x, y: w.y, w: w.w, h: w.bridge.y1 - w.y });
        b.push({ x: w.x, y: w.bridge.y2, w: w.w, h: w.y + w.h - w.bridge.y2 });
      }
    }
    for (const d of S.doors) if (!d.open) b.push(d);
    if (!S.gate.open) b.push(S.gate);
    for (const c of S.cages) if (!c.open) b.push({ x: c.x - 26, y: c.y - 26, w: 52, h: 52 });
    if (forEnemy) b.push(...S.thorns);
    return b;
  }
  function collide(S, e, r, forEnemy) {
    const bl = blockers(S, forEnemy);
    let hit = false;
    for (let k = 0; k < 2; k++) for (const R of bl) if (R.w > 0 && R.h > 0 && pushOut(e, r, R)) hit = true;
    if (e.x < r) { e.x = r; hit = true; } if (e.y < r) { e.y = r; hit = true; }
    if (e.x > S.W - r) { e.x = S.W - r; hit = true; } if (e.y > S.H - r) { e.y = S.H - r; hit = true; }
    return hit;
  }

  // ---------- trail & loops ----------
  // a closed ribbon counts as a loop only if it is big enough and not a thin sliver
  function loopShapeOk(poly) {
    const a = polyArea(poly);
    if (a < C.MIN_LOOP_AREA) return false;
    let per = 0;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) per += Math.hypot(poly[i].x - poly[j].x, poly[i].y - poly[j].y);
    return (2 * a) / per >= C.MIN_LOOP_WIDTH;
  }
  function clearTrail(S) { S.trail = []; S.trailLen = 0; }
  function addTrail(S, ev) {
    const p = S.player, tr = S.trail;
    const last = tr[tr.length - 1];
    if (last && Math.hypot(p.x - last.x, p.y - last.y) < C.TRAIL_STEP) return;
    const np = { x: p.x, y: p.y, t: S.t };
    if (last) {
      // test the new segment against older segments (skip the newest few)
      for (let i = tr.length - 4; i >= 0; i--) {
        const a = tr[i], b = tr[i + 1];
        const h = segX(last.x, last.y, np.x, np.y, a.x, a.y, b.x, b.y);
        if (!h) continue;
        const poly = [{ x: h.x, y: h.y }];
        for (let j = i + 1; j < tr.length; j++) poly.push(tr[j]);
        poly.push({ x: h.x, y: h.y });
        if (loopShapeOk(poly)) { closeLoop(S, poly, ev); return; }
        break;
      }
      // forgiving close: touching an older part of the ribbon also closes the loop
      let back = 0;
      for (let i = tr.length - 1; i > 0; i--) {
        back += Math.hypot(tr[i].x - tr[i - 1].x, tr[i].y - tr[i - 1].y);
        if (back < C.CLOSE_BACK) continue;
        const q = tr[i - 1];
        if (Math.hypot(q.x - np.x, q.y - np.y) < C.CLOSE_R) {
          const poly = tr.slice(i - 1).concat([np]);
          if (loopShapeOk(poly)) { closeLoop(S, poly, ev); return; }
        }
      }
      S.trailLen += Math.hypot(np.x - last.x, np.y - last.y);
    }
    tr.push(np);
    while (S.trailLen > (S.trailMax || C.TRAIL_MAX) && tr.length > 2) {
      S.trailLen -= Math.hypot(tr[1].x - tr[0].x, tr[1].y - tr[0].y);
      tr.shift();
    }
  }
  function closeLoop(S, poly, ev) {
    S.loops++;
    let caught = 0, popped = 0, sx = 0, sy = 0;
    const got = (x, y) => { caught++; sx += x; sy += y; };
    for (const e of S.enemies) if (e.alive && inPoly(e.x, e.y, poly)) {
      if (e.kind === 'big' && !e.shrunk) {
        // a big grump needs two loops: the first shrinks it into a fast, angry chaser
        // it is stunned for a moment first (st 'dizzy', no new event), so it cannot bump a hero standing
        // where the loop closed before they can react
        e.shrunk = true; e.r = 22; e.speed = Math.max(e.speed, 80); e.range = Math.max(e.range || 0, 260); got(e.x, e.y);
        e.stun = C.SHRINK_STUN; e.st = 'dizzy'; e.tm = 0;
        ev.push({ t: 'shrink', x: e.x, y: e.y });
        continue;
      }
      e.alive = false; e.pop = 1; popped++; got(e.x, e.y);
      ev.push({ t: 'pop', x: e.x, y: e.y, kind: e.kind });
    }
    for (const b of S.buds) if (!b.open && inPoly(b.x, b.y, poly)) {
      b.open = true; got(b.x, b.y);
      const w = S.water.find((q) => q.id === b.water);
      if (w) w.bridged = true;
      ev.push({ t: 'bloom', x: b.x, y: b.y });
    }
    for (const c of S.cages) if (!c.open && inPoly(c.x, c.y, poly)) {
      c.open = true; got(c.x, c.y);
      ev.push({ t: 'free', x: c.x, y: c.y, who: c.who });
      if (c.releases) { const f = S.followers.find((q) => q.id === c.releases); if (f) f.free = true; }
    }
    const cx = poly.reduce((s, q) => s + q.x, 0) / poly.length, cy = poly.reduce((s, q) => s + q.y, 0) / poly.length;
    ev.push({ t: 'loop', poly: poly.map((q) => ({ x: q.x, y: q.y })), caught, x: cx, y: cy });
    // one loop, several catches: a combo, centred on what it caught
    if (caught >= 2) {
      ev.push({ t: 'combo', n: caught, x: sx / caught, y: sy / caught });
      if (caught > S.bestCombo) S.bestCombo = caught;
    }
    // arena score: n grumps in one loop are worth n*n
    if (S.arena && popped) { S.arena.score += popped * popped; S.arena.kills += popped; }
    if (caught) S.lastProgress = S.t;
    clearTrail(S);
  }
  function trailHits(S, x, y, r) {
    const tr = S.trail;
    for (let i = 0; i < tr.length - 1; i++) {
      const a = tr[i], b = tr[i + 1];
      const vx = b.x - a.x, vy = b.y - a.y, L2 = vx * vx + vy * vy || 1;
      let t = ((x - a.x) * vx + (y - a.y) * vy) / L2; t = Math.max(0, Math.min(1, t));
      const dx = a.x + vx * t - x, dy = a.y + vy * t - y;
      if (dx * dx + dy * dy < r * r) return i;
    }
    return -1;
  }

  // ---------- enemies ----------
  // distance from (x, y) to the nearest thing that blocks enemies (walls, water, thorns, room edge)
  function clearance(S, x, y) {
    let m = Math.min(x, y, S.W - x, S.H - y);
    for (const R of blockers(S, true)) {
      if (R.w <= 0 || R.h <= 0) continue;
      const dx = Math.max(R.x - x, 0, x - (R.x + R.w)), dy = Math.max(R.y - y, 0, y - (R.y + R.h));
      m = Math.min(m, Math.hypot(dx, dy));
    }
    return m;
  }
  // after a charge, pick where the dizzy dasher settles: back along its charge until the hero has room
  // to walk all the way around it (a dasher pinned to a wall could never be looped)
  function recoilSpot(S, e) {
    const need = e.r + 2 * C.PLAYER_R + C.DIZZY_ROOM;
    let best = { x: e.x, y: e.y, c: clearance(S, e.x, e.y) };
    const back = Math.hypot(e.x - e.sx, e.y - e.sy);
    for (let s = 4; best.c < need && s <= back + 2; s += 4) {
      const k = Math.min(s, back), x = e.x - e.dx * k, y = e.y - e.dy * k, c = clearance(S, x, y);
      if (c > best.c) best = { x, y, c };
    }
    return best;
  }
  function moveEnemy(S, e, dt, ev) {
    const p = S.player;
    const alivePlayer = !p.dead;
    e.tm += dt;
    if (e.stun > 0) { e.stun = Math.max(0, e.stun - dt); return; }
    let tx = null, ty = null, sp = e.speed;
    switch (e.kind) {
      case 'sleepy': return;
      case 'wander': case 'cutter': {
        const path = e.path;
        const tgt = path[e.pi];
        tx = tgt.x; ty = tgt.y;
        if (Math.hypot(tx - e.x, ty - e.y) < 6) {
          if (e.loop) e.pi = (e.pi + 1) % path.length;
          else { if (e.pi + e.dir >= path.length || e.pi + e.dir < 0) e.dir *= -1; e.pi += e.dir; }
        }
        break;
      }
      case 'chaser': case 'big': {
        const d = Math.hypot(p.x - e.x, p.y - e.y);
        const range = e.range || 230;
        if (alivePlayer && d < range && Math.hypot(e.x - e.hx, e.y - e.hy) < (e.leash || 360)) { tx = p.x; ty = p.y; e.st = 'chase'; }
        else { tx = e.hx; ty = e.hy; e.st = 'home'; sp *= 0.7; }
        break;
      }
      case 'dasher': {
        const d = Math.hypot(p.x - e.x, p.y - e.y);
        if (e.st === 'idle') {
          if (alivePlayer && d < (e.range || 280) && e.tm > 0.4) { e.st = 'wind'; e.tm = 0; e.ax = p.x - e.x; e.ay = p.y - e.y; ev.push({ t: 'wind', x: e.x, y: e.y }); }
          else if (e.stalk && alivePlayer) { tx = p.x; ty = p.y; sp = e.stalk; } // arena dashers creep toward the hero
          else { tx = e.hx; ty = e.hy; sp = 40; }
        } else if (e.st === 'wind') {
          e.ax = p.x - e.x; e.ay = p.y - e.y;
          if (e.tm > 0.75) { const L = Math.hypot(e.ax, e.ay) || 1; e.dx = e.ax / L; e.dy = e.ay / L; e.sx = e.x; e.sy = e.y; e.st = 'dash'; e.tm = 0; ev.push({ t: 'dash', x: e.x, y: e.y }); }
          return;
        } else if (e.st === 'dash') {
          const bx = e.x, by = e.y;
          e.x += e.dx * 470 * dt; e.y += e.dy * 470 * dt;
          const hit = collide(S, e, e.r, true);
          if (hit || e.tm > 0.85 || Math.hypot(e.x - bx, e.y - by) < 470 * dt * 0.3) {
            e.st = 'dizzy'; e.tm = 0; ev.push({ t: 'bonk', x: e.x, y: e.y, hard: hit });
            const r = recoilSpot(S, e);
            if (Math.hypot(r.x - e.x, r.y - e.y) > 1) { e.rx = r.x; e.ry = r.y; }
          }
          return;
        } else if (e.st === 'dizzy') {
          if (e.rx !== undefined) {
            // bounce back into open space; the dizzy timer starts once it has settled
            const dx = e.rx - e.x, dy = e.ry - e.y, L = Math.hypot(dx, dy), s = Math.min(L, 420 * dt);
            const ox = e.x, oy = e.y;
            if (L > 0.5) { e.x += (dx / L) * s; e.y += (dy / L) * s; collide(S, e, e.r, true); }
            // settled, or blocked on the way back (never leave it sliding forever)
            if (L - s <= 0.5 || Math.hypot(e.x - ox, e.y - oy) < s * 0.3) e.rx = e.ry = undefined;
            e.tm = 0;
            return;
          }
          if (e.tm > (e.dizzy || 1.8)) { e.st = 'idle'; e.tm = 0; }
          return;
        }
        break;
      }
    }
    if (tx === null) return;
    const dx = tx - e.x, dy = ty - e.y, L = Math.hypot(dx, dy);
    if (L > 1) {
      const s = Math.min(L, sp * dt);
      e.x += (dx / L) * s; e.y += (dy / L) * s;
      e.vx = dx / L; e.vy = dy / L;
    }
    collide(S, e, e.r, true);
  }

  // ---------- main step ----------
  function hurt(S, ev, why) {
    const p = S.player;
    if (p.dead || p.inv > 0 || S.won) return;
    p.dead = C.RESPAWN_TIME; S.hurts++;
    ev.push({ t: 'hurt', x: p.x, y: p.y, why });
    clearTrail(S);
    for (const e of S.enemies) if (e.kind === 'dasher' && e.alive) { e.st = 'idle'; e.tm = 0; e.x = e.hx; e.y = e.hy; e.rx = e.ry = undefined; }
    for (const e of S.enemies) if ((e.kind === 'chaser' || e.kind === 'big') && e.alive) { e.x = e.hx; e.y = e.hy; }
  }

  // steering, walls, ribbon growth/fading and follower path memory (shared by rooms and the arena)
  function movePlayer(S, input, dt, ev) {
    const p = S.player;
    let mx = input.mx || 0, my = input.my || 0;
    const m = Math.hypot(mx, my);
    if (m > 1) { mx /= m; my /= m; }
    const tvx = mx * C.SPEED, tvy = my * C.SPEED;
    const a = C.ACCEL * dt;
    p.vx += Math.max(-a, Math.min(a, tvx - p.vx));
    p.vy += Math.max(-a, Math.min(a, tvy - p.vy));
    p.x += p.vx * dt; p.y += p.vy * dt;
    collide(S, p, C.PLAYER_R, false);
    const sp = Math.hypot(p.vx, p.vy);
    p.moving = sp;
    if (S.clock0 == null && sp > 20) S.clock0 = S.t; // the sun clock starts with the first step

      check: { x: ARENA.start.x, y: ARENA.start.y },

  // ---------- grumps (all danger: dark, spiky, coral eyes) ----------
  function spikyPath(r, n, spike, wob) {

  // arena result: your flower bouquet, a crown when it beats your best
